[build]
  command = "npm run build"
  publish = "dist"

# Weekend-Live API: the browser calls /wl-api/... on this domain and the
# netlify/functions/wl-api.mjs function forwards it to the API gateway
# (https://appi-wl.azure-api.net/service/api), adding the APIM subscription key
# from the WL_API_KEY environment variable. Set WL_API_URL / WL_API_KEY in
# Netlify → Site configuration → Environment variables.

# Single-page app routes (listed explicitly so /api/* functions are never shadowed).
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/register"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/forgot-password"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/workshops/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/workshops"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/campaigns/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/events"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/community"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/learn/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/learn"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/heritage"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/projects/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/shop/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/shop"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/cart"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/checkout"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/my-designs"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Hashed build files and images never change once deployed — cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
