  to = "/index.html"
  status = 200
[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/workshops/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/workshops"
  to = "/index.html"
  status = 200
[[redirects]]
